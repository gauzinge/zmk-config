# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  # - board: nice_nano_v2
  #   shield: corne_left nice_view_adapter nice_view
  #   # snippet: studio-rpc-usb-uart
  #   cmake-args: -DCONFIG_ZMK_STUDIO=y
  # - board: nice_nano_v2
  #   shield: corne_right nice_view_adapter nice_view
  - board: lpgalaxy_blank_slate
    #snippet: studio-rpc-usb-uart
    #cmake-args: -DCONFIG_ZMK_STUDIO=y
    #artifact-name: lpgalaxy_blank_slate-studio
  - board: planck_rev6
  - board: ergohaven
    shield: trackball
    keymap: trackball_v3.0
    # snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_KEYBOARD_NAME=\"EH\ TB\ v3.0\" -DKEYMAP_FILE=\"/__w/zmk-config/zmk-config/config/trackball_v3.0.keymap\"
    # artifact-name: trackball_v3.0-ergohaven-zmk
  # - board: seeeduino_xiao_ble
  #   keymap: trackball_v3.0
  #   # The shield might not be needed if the base trackball configuration is baked 
  #   # directly into the trackball_v3.0.keymap or handled via your west.yml module.
  #   # If the build fails to find a shield, comment this line out:
  #   shield: trackball 
  #   cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_KEYBOARD_NAME=\"EH\ TB\ v3.0\"
  #   artifact-name: trackball_v3.0-ergohaven-zmk
