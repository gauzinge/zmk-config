# Enable ZMK Pointer (Mouse Emulation and Driver Support)
CONFIG_ZMK_POINTING=y

# Power & Sleep Settings (Optimized for 150mAh Battery)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Bluetooth Tweaks (Up to 6 profiles supported by v3)
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# Set a Custom Bluetooth Name
CONFIG_ZMK_KEYBOARD_NAME="TrackballMiniV3"

# Performance adjustments
CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_ZMK_HID_TRACKBALL_INTERFACE=y
CONFIG_PMW3610_ALT=y
